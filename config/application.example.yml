# Cấu hình mẫu dành cho bài thực hành local, không chứa thông tin thật.
# Nguồn: https://docs.spring.io/spring-boot/3.5/reference/data/sql.html
server:
  address: 127.0.0.1
  port: 8080
  error:
    include-exception: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: student-ojt-registration
  datasource:
    url: jdbc:h2:mem:ojtdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
